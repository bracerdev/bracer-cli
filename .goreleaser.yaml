# GoReleaser for the bracer CLI. Runs at the root of the public repo
# (github.com/bracerdev/bracer-cli), where this directory is published.
version: 2
project_name: bracer

before:
  hooks:
    - go mod verify

builds:
  - id: bracer
    main: .
    binary: bracer
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^ci"

release:
  name_template: "bracer {{ .Tag }}"
  # Published as soon as the build succeeds so the archives can be downloaded
  # without signing in; tags with a pre-release suffix (v1.2.3-rc.1) are marked
  # pre-release. Notes can still be edited on GitHub afterwards.
  draft: false
  prerelease: auto
